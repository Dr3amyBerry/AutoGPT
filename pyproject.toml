[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rigorcore-dev"
version = "0.1.0"
description = "Private MCP remote development workspace"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "websockets>=14,<18", "mcp>=1.20,<2"]

[project.optional-dependencies]
windows = ["pystray>=0.19.5", "Pillow>=10"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
rigorcore-dev = "rigorcore_dev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
